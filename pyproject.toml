[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "model-mountain"
version = "0.4.0"
description = "Research prototype for enterprise AI security, RAG reliability, and model-internal behavioral evaluation"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["cryptography>=41", "numpy>=1.24"]

[project.optional-dependencies]
vector-lab = ["torch>=2.2"]
dashboard = ["streamlit>=1.30", "torch>=2.2"]
notebook = ["nbformat>=5.9"]

[tool.setuptools.packages.find]
include = ["model_mountain*"]
