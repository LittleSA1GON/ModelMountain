[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "model-mountain"
version = "0.4.0"
description = "Security gateway for AI assistants with IBM vLLM-Hook (MIA) injection defenses"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["cryptography>=41", "numpy>=1.24"]

[tool.setuptools.packages.find]
include = ["model_mountain*"]
